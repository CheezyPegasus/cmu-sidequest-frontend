<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMU Sidequest Randomizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">CMU SIDEQUEST RANDOMIZER</p>
      <h1>Find something to do.</h1>
      <p class="subtitle">Choose your time, distance, budget, and group size. This page sends your preferences to a Flask backend hosted on Render.</p>
    </header>

    <section class="panel">
      <label>Time available
        <select id="time">
          <option value="1">1 hour</option><option value="2">2 hours</option>
          <option value="3" selected>3 hours</option><option value="6">6 hours</option>
          <option value="12">12 hours</option>
        </select>
      </label>
      <label>Maximum distance
        <select id="distance">
          <option value="1">1 mile</option><option value="3">3 miles</option>
          <option value="5">5 miles</option><option value="10" selected>10 miles</option>
          <option value="25">25 miles</option>
        </select>
      </label>
      <label>Budget
        <select id="budget">
          <option value="free">Free only</option>
          <option value="paid" selected>Paid is okay</option>
        </select>
      </label>
      <label>Group
        <select id="group">
          <option value="solo">Solo</option>
          <option value="friends" selected>Friends</option>
          <option value="group">Group</option>
        </select>
      </label>
      <button id="go">Give me a sidequest</button>
    </section>

    <p id="status" class="status" aria-live="polite"></p>

    <article id="result" class="card hidden">
      <p id="category" class="eyebrow"></p>
      <h2 id="title"></h2>
      <p id="description"></p>
      <p id="address" class="muted"></p>
      <p id="meta" class="meta"></p>
      <div class="ratings">
        <span>Uniqueness: <strong id="uniqueness"></strong>/5</span>
        <span>Niche: <strong id="niche"></strong>/5</span>
        <span>Accessibility: <strong id="accessibility"></strong>/5</span>
        <span>Isolation: <strong id="isolation"></strong>/5</span>
      </div>
    </article>
  </main>
  <script src="script.js"></script>
</body>
</html>
